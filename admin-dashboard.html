<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Admin Dashboard</title>
    <style>
      body { font-family: 'Inter', 'Segoe UI', sans-serif; background: linear-gradient(135deg, #081120 0%, #11253d 45%, #1d4ed8 100%); margin: 0; padding: 24px; color: #f8fafc; }
      .card { max-width: 980px; margin: 0 auto; background: rgba(15,58,122,0.92); border: 1px solid rgba(255,255,255,0.18); border-radius: 24px; padding: 24px; box-shadow: 0 18px 48px rgba(8,17,32,0.25); }
      table { width: 100%; border-collapse: collapse; margin-top: 16px; }
      th, td { border-bottom: 1px solid rgba(255,255,255,0.12); padding: 10px; text-align: left; }
      button { padding: 8px 12px; border: none; background: linear-gradient(90deg, #38bdf8, #2563eb); color: #fff; border-radius: 999px; cursor: pointer; }
      .status { margin-top: 12px; color: #c7f9cc; }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>Admin Dashboard</h1>
      <button onclick="loadEmployees()">Load employee summary</button>
      <div id="status" class="status">Waiting for data...</div>
      <table>
        <thead>
          <tr><th>Name</th><th>Department</th><th>Completion</th><th>Pending</th><th>Files</th><th>Action</th></tr>
        </thead>
        <tbody id="employee-body"></tbody>
      </table>
    </div>

    <script>
      async function loadEmployees() {
        const response = await fetch('/api/admin/employees');
        const employees = await response.json();
        const body = document.getElementById('employee-body');
        body.innerHTML = '';
        employees.forEach((employee) => {
          const row = document.createElement('tr');
          row.innerHTML = `
            <td>${employee.name}</td>
            <td>${employee.department}</td>
            <td>${employee.completion_percentage}%</td>
            <td>${employee.pending_tasks}</td>
            <td>${employee.uploaded_files}</td>
            <td><button onclick="remind('${employee.id}')">Remind</button></td>
          `;
          body.appendChild(row);
        });
        document.getElementById('status').textContent = 'Employee summary loaded.';
      }

      async function remind(employeeId) {
        await fetch('/api/admin/remind', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ employee_id: Number(employeeId), message: 'Please complete your onboarding tasks.' })
        });
        document.getElementById('status').textContent = `Reminder sent to employee ${employeeId}.`;
      }

      const events = new EventSource('/api/events');
      events.onopen = () => {
        document.getElementById('status').textContent = 'Live reminders connected.';
      };
      events.addEventListener('reminder', (event) => {
        const payload = JSON.parse(event.data);
        document.getElementById('status').textContent = `Reminder received for employee ${payload.employee_id}: ${payload.message}`;
      });
    </script>
  </body>
</html>
